{% extends 'base.html' %}
{% block title %}BMI Calculator{% endblock %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 0 auto;">
    <h2 class="text-center"><i class="fa-solid fa-weight-scale"></i> BMI Calculator</h2>
    <p class="text-center">Enter your height and weight to calculate your Body Mass Index.</p>
    
    <form method="POST" action="{{ url_for('bmi') }}">
        <div class="form-group">
            <label for="height">Height (in cm):</label>
            <input type="number" id="height" name="height" required min="50" max="300" step="0.1" placeholder="e.g. 175">
        </div>
        <div class="form-group">
            <label for="weight">Weight (in kg):</label>
            <input type="number" id="weight" name="weight" required min="10" max="500" step="0.1" placeholder="e.g. 70">
        </div>
        <button type="submit" class="btn">Calculate BMI</button>
    </form>
</div>
{% endblock %}
