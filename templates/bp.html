{% extends 'base.html' %}
{% block title %}BP Analyzer{% endblock %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 0 auto;">
    <h2 class="text-center"><i class="fa-solid fa-heart-circle-bolt"></i> Blood Pressure Analyzer</h2>
    <p class="text-center">Analyze your systolic and diastolic readings.</p>
    
    <form method="POST" action="{{ url_for('bp') }}">
        <div class="form-group">
            <label for="systolic">Systolic (Upper number):</label>
            <input type="number" id="systolic" name="systolic" required min="50" max="250" placeholder="e.g. 120">
        </div>
        <div class="form-group">
            <label for="diastolic">Diastolic (Lower number):</label>
            <input type="number" id="diastolic" name="diastolic" required min="30" max="150" placeholder="e.g. 80">
        </div>
        <button type="submit" class="btn">Analyze BP</button>
    </form>
</div>
{% endblock %}
