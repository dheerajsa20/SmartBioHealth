{% extends 'base.html' %}
{% block title %}Diabetes Risk Checker{% endblock %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 0 auto;">
    <h2 class="text-center"><i class="fa-solid fa-droplet"></i> Diabetes Risk Checker</h2>
    
    <form method="POST" action="{{ url_for('diabetes') }}">
        <div class="form-group">
            <label for="age">Age:</label>
            <input type="number" id="age" name="age" required min="1" max="120">
        </div>
        <div class="form-group">
            <label for="bmi">BMI (approximate):</label>
            <input type="number" id="bmi" name="bmi" required min="10" max="60" step="0.1">
        </div>
        <div class="form-group">
            <label for="sugar">Fasting Sugar Level (mg/dL):</label>
            <input type="number" id="sugar" name="sugar" required min="50" max="400">
        </div>
        <div class="form-group">
            <label for="family">Family History of Diabetes:</label>
            <select name="family" id="family" required>
                <option value="no">No</option>
                <option value="yes">Yes</option>
            </select>
        </div>
        <div class="form-group">
            <label for="activity">Physical Activity Level:</label>
            <select name="activity" id="activity" required>
                <option value="normal">Normal / Active</option>
                <option value="low">Low / Sedentary</option>
            </select>
        </div>
        <button type="submit" class="btn">Check Risk</button>
    </form>
</div>
{% endblock %}
