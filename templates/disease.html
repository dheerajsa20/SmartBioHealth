{% extends 'base.html' %}
{% block title %}Disease Predictor{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
    <h2 class="text-center"><i class="fa-solid fa-virus-covid"></i> Disease Predictor</h2>
    <p class="text-center">Select your symptoms to predict possible basic diseases.</p>
    
    <form method="POST" action="{{ url_for('disease') }}">
        <div class="form-group">
            <label>Select Symptoms (check all that apply):</label>
            <div class="checkbox-group">
                {% for symptom in symptoms %}
                <label class="checkbox-label">
                    <input type="checkbox" name="symptoms" value="{{ symptom }}">
                    {{ symptom }}
                </label>
                {% endfor %}
            </div>
        </div>
        <button type="submit" class="btn">Predict Disease</button>
    </form>
</div>
{% endblock %}
