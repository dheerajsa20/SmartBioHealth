{% extends 'base.html' %}
{% block title %}First Aid Guide{% endblock %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 0 auto;">
    <h2 class="text-center"><i class="fa-solid fa-kit-medical"></i> First Aid Guide</h2>
    <p class="text-center">Select an emergency type to view immediate action steps.</p>
    
    <form method="POST" action="{{ url_for('firstaid') }}">
        <div class="form-group">
            <label for="emergency">Emergency Type:</label>
            <select name="emergency" id="emergency" required>
                <option value="" disabled selected>Select an option</option>
                {% for e in emergencies %}
                <option value="{{ e }}">{{ e | capitalize }}</option>
                {% endfor %}
            </select>
        </div>
        <button type="submit" class="btn">Get Instructions</button>
    </form>
</div>
{% endblock %}
