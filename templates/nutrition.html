{% extends 'base.html' %}
{% block title %}Nutrition Calculator{% endblock %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 0 auto;">
    <h2 class="text-center"><i class="fa-solid fa-apple-whole"></i> Nutrition & Protein Calculator</h2>
    
    <form method="POST" action="{{ url_for('nutrition') }}">
        <div class="form-group">
            <label for="weight">Weight (in kg):</label>
            <input type="number" id="weight" name="weight" required min="20" max="300" step="0.1">
        </div>
        <div class="form-group">
            <label for="goal">Primary Goal:</label>
            <select name="goal" id="goal" required>
                <option value="maintain">Maintain Weight</option>
                <option value="muscle">Build Muscle</option>
                <option value="loss">Lose Fat</option>
            </select>
        </div>
        <div class="form-group">
            <label for="activity">Activity Level:</label>
            <select name="activity" id="activity" required>
                <option value="sedentary">Sedentary (little to no exercise)</option>
                <option value="moderate">Moderate (exercise 3-5 days/week)</option>
                <option value="high">High (intense exercise daily)</option>
            </select>
        </div>
        <button type="submit" class="btn">Calculate Protein</button>
    </form>
</div>
{% endblock %}
